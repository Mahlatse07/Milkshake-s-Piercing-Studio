    <main class="gallery-page">

        <h1>Our Gallery</h1>

        <p class="gallery-intro">
            Explore our piercing inspiration and take a look
            inside Milkshake's Piercing Studio.
        </p>

        <!-- GALLERY FILTERS -->

        <div class="gallery-filters">

            <button class="filter-button active"
                    data-filter="all"
                    type="button">All</button>

            <button class="filter-button"
                    data-filter="ear"
                    type="button">Ear</button>

            <button class="filter-button"
                    data-filter="facial"
                    type="button">Facial</button>

            <button class="filter-button"
                    data-filter="body"
                    type="button">Body</button>

            <button class="filter-button"
                    data-filter="studio"
                    type="button">Studio</button>

        </div>

        <!-- GALLERY IMAGES -->

        <div class="gallery-grid">

            <div class="gallery-item" data-category="ear">
                <img src="Images/ear.jpg"
                     alt="Ear piercing inspiration">
            </div>

            <div class="gallery-item" data-category="ear">
                <img src="Images/Ear2.jpg"
                     alt="Additional ear piercing inspiration">
            </div>

            <div class="gallery-item" data-category="facial">
                <img src="Images/nose.jpg"
                     alt="Nose piercing inspiration">
            </div>

            <div class="gallery-item" data-category="facial">
                <img src="Images/Septum hehe.jpg"
                     alt="Septum piercing inspiration">
            </div>

            <div class="gallery-item" data-category="body">
                <img src="Images/belly.jpg"
                     alt="Belly piercing inspiration">
            </div>

            <div class="gallery-item" data-category="body">
                <img src="Images/tongue.jpg"
                     alt="Tongue piercing inspiration">
            </div>

            <div class="gallery-item" data-category="body">
                <img src="Images/Dermal.jpg"
                     alt="Dermal piercing inspiration">
            </div>

            <div class="gallery-item" data-category="studio">
                <img src="Images/Studio.jpg"
                     alt="Interior of Milkshake's Piercing Studio">
            </div>

            <div class="gallery-item" data-category="studio">
                <img src="Images/studio wallpaper.jpg"
                     alt="Piercing studio display">
            </div>

            <div class="gallery-item" data-category="studio">
                <img src="Images/Piercing time!.jpg"
                     alt="Piercing studio display">
            </div>

            <div class="gallery-item" data-category="studio">
                <img src="Images/Custom neon sign Piercing.jpg"
                     alt="Milkshake's Piercing Studio neon sign">
            </div>

            <div class="gallery-item" data-category="studio">
                <img src="Images/Piercing.jpg"
                     alt="Piercing studio photograph">
            </div>

            <div class="gallery-item" data-category="studio">
                <img src="Images/download (3).jpg"
                     alt="Piercing inspiration">
            </div>

        </div>

    </main>

    <!-- IMAGE LIGHTBOX -->

    <div class="lightbox" id="lightbox" aria-hidden="true">

        <button class="lightbox-close"
                id="closeLightbox"
                type="button"
                aria-label="Close image">×</button>

        <button id="prevImage"
                type="button"
                aria-label="Previous image">‹</button>

        <img id="lightboxImage" src="" alt="">

        <button id="nextImage"
                type="button"
                aria-label="Next image">›</button>

    </div>
