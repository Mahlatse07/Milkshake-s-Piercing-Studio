    <main class="form-section">

        <h1>Make an Enquiry</h1>

        <p>Interested in our piercing services or jewellery? Send us an enquiry below.</p>

        <form id="enquiryForm" action="https://formspree.io/f/xrppyvvk" method="POST">

            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required minlength="2">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required pattern="[0-9+ ]{7,15}" title="Enter a valid phone number.">

            <label for="enquiryType">What is your enquiry about?</label>
            <select id="enquiryType" name="enquiryType" required>
                <option value="">Select an option</option>
                <option value="Piercing services">Piercing services</option>
                <option value="Jewellery">Jewellery</option>
                <option value="Volunteering">Volunteering</option>
                <option value="Sponsorship">Sponsorship</option>
                <option value="Other">Other</option>
            </select>

            <label for="enquiryMessage">Tell us more about your enquiry:</label>
            <textarea id="enquiryMessage" name="enquiryMessage" rows="5" required minlength="10"></textarea>

            <button type="submit">Submit Enquiry</button>

            <p id="enquiryResponse" aria-live="polite"></p>

        </form>

    </main>

    <script src="JavaScript/enquiry.js" defer></script>
    <script src="JavaScript/datetime.js" defer></script>
