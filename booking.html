    <main>

        <h2>Book an Appointment</h2>

        <p>
            Complete the form below to request an appointment.
        </p>

        <form>

            <p>
                <label for="fullname">Full Name:</label>
                <input type="text"
                       id="fullname"
                       name="fullname"
                       required>
            </p>

            <p>
                <label for="email">Email Address:</label>
                <input type="email"
                       id="email"
                       name="email"
                       required>
            </p>

            <p>
                <label for="phone">Phone Number:</label>
                <input type="tel"
                       id="phone"
                       name="phone"
                       required>
            </p>

            <p>
                <label for="piercing">
                    Select Piercing:
                </label>

                <select id="piercing" name="piercing">

                    <option value="">-- Select --</option>
                    <option value="ear">Ear Piercing</option>
                    <option value="nose">Nose Piercing</option>
                    <option value="septum">Septum Piercing</option>
                    <option value="mouth">mouth Piercing</option>
                    <option value="body">Body Piercing</option>

                </select>
            </p>

            <p>
                <label for="date">Preferred Date:</label>

                <input type="date"
                       id="date"
                       name="date">
            </p>

            <p>
                <label for="time">Preferred Time:</label>

                <input type="time"
                       id="time"
                       name="time">
            </p>

            <p>
                <label for="message">
                    Additional Information:
                </label>
            </p>

            <textarea id="message"
                      name="message"
                      rows="5"
                      cols="40"></textarea>

            <p>
                <input type="submit"
                       value="Submit Booking Request">
            </p>

        </form>

    </main>
